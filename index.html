<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherC App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <h1>Welcome to WeatherC</h1>

    <nav class="navbar navbar-expand-lg navbar-dark weather-navbar">
        <div class="container">
            <a class="navbar-brand" href="#">
                WeatherC
            </a>
            <span class="navbar-text">
                Your Weather, Your World
            </span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="text-center">
            <h1>Check Your Weather</h1>
            <p>Find the weather information of your city</p>
        </div>
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Enter city name..." id="cityInput">
                    <button class="btn btn-primary" id="searchButton">
                        Search
                    </button>
                </div>
            </div>
        </div>
    </div>


    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <div class="weather-card">
                <h2>Colombo, Sri Lanka</h2>
                <p class="weather-date">Saturday, November 21</p>
                <div class="weather-icon">
                    ☀️
                </div>

                <h1 class="temperature">29°C</h1>
                <h3 class="weather-condition">Sunny</h3>
                <p class="weather-description">
                    Clear sky with bright sunshine
                </p>
                <hr>

                <div class="row text-center">
                    <div class="col-4">
                        <h5>Humidity</h5>
                        <p>75%</p>
                    </div>
                    <div class="col-4">
                        <h5>Wind Speed</h5>
                        <p>12 km/h</p>
                    </div>
                    <div class="col-4">
                        <h5>Feels Like</h5>
                        <p>32°C</p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
